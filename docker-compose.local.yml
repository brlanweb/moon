services:
  db:
    image: mariadb:10.8
    container_name: moon4-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - moon4_mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: moon
      MYSQL_USER: moon
      MYSQL_PASSWORD: moon.cc
      MYSQL_ROOT_PASSWORD: moon.cc
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 12

  moon:
    image: moon4-local
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: moon4
    privileged: true
    restart: unless-stopped
    volumes:
      - .:/data/moon
      - moon4_repos:/data/repos
      # Docker 类型 MCP 通过宿主机 Docker 启动临时 stdio 容器。
      # 注意：该 socket 允许应用容器管理宿主机 Docker 资源。
      - /var/run/docker.sock:/var/run/docker.sock
      # 覆盖镜像内置配置，为智能体 SSE 关闭缓冲
      - ./docs/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8000:80"
    environment:
      MOON_MCP_RESOURCE_URL: "${MOON_MCP_RESOURCE_URL:-http://127.0.0.1:8000/mcp}"
      MOON_MCP_ISSUER_URL: "${MOON_MCP_ISSUER_URL:-http://127.0.0.1:8000}"
      MOON_MCP_FILE_DIRS: "${MOON_MCP_FILE_DIRS:-/tmp,/opt,/srv,/data,/home,/root}"
      MOON_DEBUG: "true"
      MOON_DB_ENGINE: django.db.backends.mysql
      MOON_DB_NAME: moon
      MOON_DB_USER: moon
      MOON_DB_PASSWORD: moon.cc
      MOON_DB_HOST: db
      MOON_DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  moon4_mysql:
  moon4_repos:
