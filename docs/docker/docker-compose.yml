services:
  db:
    image: mariadb:10.8
    container_name: moon-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - /data/moon/mysql:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=moon
      - MYSQL_USER=moon
      - MYSQL_PASSWORD=moon.cc
      - MYSQL_ROOT_PASSWORD=moon.cc
  moon:
    # 使用仓库根目录的 Dockerfile.local 或 docs/docker/Dockerfile 自行构建
    image: moon-service:latest
    container_name: moon
    privileged: true
    restart: always
    volumes:
      - /data/moon/service:/data/moon
      - /data/moon/repos:/data/repos
    ports:
      # 如果80端口被占用可替换为其他端口，例如: - "8000:80"
      - "80:80"
    environment:
      # 首次启动时按此分支/标签从 MOON_REPO_URL 拉取代码
      - MOON_DOCKER_VERSION=4.0
      - MOON_REPO_URL=https://github.com/brlanweb/moon.git
      - MOON_SECRET_KEY=请替换为随机字符串
      - MOON_DB_ENGINE=django.db.backends.mysql
      - MOON_DB_NAME=moon
      - MOON_DB_USER=moon
      - MOON_DB_PASSWORD=moon.cc
      - MOON_DB_HOST=db
      - MOON_DB_PORT=3306
    depends_on:
      - db
