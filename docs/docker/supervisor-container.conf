# 容器内默认 Supervisor 配置（含容器内 Redis）；host 网络部署由 supervisor-host.conf 覆盖。
[supervisord]
nodaemon=true

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:nginx]
command = nginx -g "daemon off;"
autostart = true

[program:redis]
command = redis-server /etc/redis/redis.conf
autostart = true

[program:moon-api]
command = sh /data/moon/moon_api/tools/start-api.sh
autostart = true
stdout_logfile = /data/moon/moon_api/logs/api.log
redirect_stderr = true

[program:moon-ws]
command = sh /data/moon/moon_api/tools/start-ws.sh
autostart = true
stdout_logfile = /data/moon/moon_api/logs/ws.log
redirect_stderr = true

# MCP is loaded from the image's separate moon-mcp.conf fragment.

[program:moon-worker]
command = sh /data/moon/moon_api/tools/start-worker.sh
autostart = true
stdout_logfile = /data/moon/moon_api/logs/worker.log
redirect_stderr = true

[program:moon-monitor]
command = sh /data/moon/moon_api/tools/start-monitor.sh
autostart = true
startsecs = 3
stdout_logfile = /data/moon/moon_api/logs/monitor.log
redirect_stderr = true

[program:moon-scheduler]
command = sh /data/moon/moon_api/tools/start-scheduler.sh
autostart = true
startsecs = 3
stdout_logfile = /data/moon/moon_api/logs/scheduler.log
redirect_stderr = true
